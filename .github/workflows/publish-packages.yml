name: Attach XR1-L Play beta v1 packages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-beta-v1
  cancel-in-progress: false

jobs:
  upload-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify the approved Linux and Windows packages
        env:
          PACKAGE_BASE: https://raw.githubusercontent.com/Jpooo/XR1-Play/f016f5c5cebfe69cc33a04469c5c77495bb0a461/beta-v1
        run: |
          mkdir packages
          cd packages
          for package in SHA256SUMS XR1-L-Play-beta-v1-Linux-x86_64.AppImage XR1-L-Play-beta-v1-Windows-x64.zip; do
            curl --fail --location --retry 3 --max-time 120 "$PACKAGE_BASE/$package" --output "$package"
          done
          sha256sum --check SHA256SUMS
      - name: Attach the approved packages to the combined release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload beta-v1 \
            packages/XR1-L-Play-beta-v1-Linux-x86_64.AppImage \
            packages/XR1-L-Play-beta-v1-Windows-x64.zip packages/SHA256SUMS
