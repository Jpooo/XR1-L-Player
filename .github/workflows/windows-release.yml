name: Attach Windows 1.5.1 preview package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/windows-release.yml]

permissions:
  contents: write

concurrency:
  group: publish-windows-1.5.1
  cancel-in-progress: false

jobs:
  upload-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify the Windows preview package
        env:
          PACKAGE_BASE: https://raw.githubusercontent.com/Jpooo/XR1-Play/382a68f1b57d96695755793a4ebf0373c0c93f73/v1.5.1-windows-preview
        run: |
          mkdir packages
          cd packages
          for package in SHA256SUMS XR1-Play-1.5.1-Windows-x64.zip; do
            curl --fail --location --retry 3 --max-time 120 "$PACKAGE_BASE/$package" --output "$package"
          done
          sha256sum --check SHA256SUMS
      - name: Attach the Windows ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload v1.5.1-windows-preview \
            packages/XR1-Play-1.5.1-Windows-x64.zip packages/SHA256SUMS
