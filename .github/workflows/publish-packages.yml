name: Publish XR1-L Play Windows Beta v1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-windows-beta-v1
  cancel-in-progress: false

jobs:
  upload-windows-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify the approved Windows Beta v1 package
        env:
          PACKAGE_BASE: https://raw.githubusercontent.com/Jpooo/XR1-Play/1a06a3be4897d144d7d1d7ebf39ef100455cd685/windows-beta-v1
        run: |
          mkdir packages
          cd packages
          for package in SHA256SUMS XR1-L-Play-Windows-Beta-v1-x64.zip; do
            curl --fail --location --retry 3 --max-time 120 "$PACKAGE_BASE/$package" --output "$package"
          done
          sha256sum --check SHA256SUMS
      - name: Attach the Windows ZIP and checksum to its beta release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload windows-beta-v1 \
            packages/XR1-L-Play-Windows-Beta-v1-x64.zip packages/SHA256SUMS
