name: Publish approved XR1-L Player Beta V2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-xr1-l-player-beta-v2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify the approved packages
        env:
          ASSET_BASE: https://raw.githubusercontent.com/${{ github.repository }}/63be0481b4a8b85f4545c71b4b9c8f76ecbf4a5c
        run: |
          mkdir packages
          cd packages
          for name in XR1-L-Player-Beta-V2-SHA256SUMS release-notes.md XR1-L-Player-Beta-V2-Linux-x86_64.AppImage XR1-L-Player-Beta-V2-Linux-x86_64.zip XR1-L-Player-Beta-V2-Windows-x64.zip; do
            curl --fail --location --retry 3 --max-time 120 "$ASSET_BASE/$name" --output "$name"
          done
          sha256sum --check XR1-L-Player-Beta-V2-SHA256SUMS
      - name: Upload verified packages and publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.parse, urllib.request
          repository = os.environ['GH_REPO']
          token = os.environ['GH_TOKEN']
          api = 'https://api.github.com/repos/' + repository
          release_id = 442314510
          headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def request(url, method='GET', data=None, content_type=None):
              outgoing = dict(headers)
              if content_type:
                  outgoing['Content-Type'] = content_type
              req = urllib.request.Request(url, data=data, headers=outgoing, method=method)
              with urllib.request.urlopen(req, timeout=180) as response:
                  body = response.read()
                  return json.loads(body) if body else None
          release_url = api + '/releases/' + str(release_id)
          release = request(release_url)
          assert release['tag_name'] == 'beta-v2' and release['name'] == 'XR1-L Player Beta V2'
          assert release['draft'], 'Refusing to overwrite an already-published release'
          native_ci = request(api + '/actions/runs/43121917195')
          assert native_ci['conclusion'] == 'success' and native_ci['head_sha'] == '6f5cb515c05d2956219dbba380c30f580eda1c06'
          folder = pathlib.Path('packages')
          names = ['XR1-L-Player-Beta-V2-Linux-x86_64.AppImage', 'XR1-L-Player-Beta-V2-Linux-x86_64.zip', 'XR1-L-Player-Beta-V2-Windows-x64.zip', 'XR1-L-Player-Beta-V2-SHA256SUMS']
          for asset in release['assets']:
              assert asset['name'] in names, 'Unexpected draft asset'
              request(api + '/releases/assets/' + str(asset['id']), 'DELETE')
          for name in names:
              data = (folder / name).read_bytes()
              url = 'https://uploads.github.com/repos/' + repository + '/releases/' + str(release_id) + '/assets?name=' + urllib.parse.quote(name)
              asset = request(url, 'POST', data, 'application/octet-stream')
              assert asset['size'] == len(data)
              assert asset['digest'] == 'sha256:' + hashlib.sha256(data).hexdigest()
              print('Verified uploaded asset:', name)
          release = request(release_url)
          assert sorted(a['name'] for a in release['assets']) == sorted(names)
          for asset in release['assets']:
              assert asset['digest'] == 'sha256:' + hashlib.sha256((folder / asset['name']).read_bytes()).hexdigest()
          payload = {'name': 'XR1-L Player Beta V2', 'tag_name': 'beta-v2', 'body': (folder / 'release-notes.md').read_text(), 'draft': False, 'prerelease': True, 'make_latest': 'false'}
          release = request(release_url, 'PATCH', json.dumps(payload).encode(), 'application/json')
          assert not release['draft'] and release['prerelease']
          print('Published:', release['html_url'])
          PY
