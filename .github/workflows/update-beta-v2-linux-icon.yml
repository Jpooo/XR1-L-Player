name: Update Beta V2 Linux icon bundle

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-xr1-l-player-beta-v2-icons
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the verified icon bundle
        env:
          ASSET_BASE: https://raw.githubusercontent.com/${{ github.repository }}/e553af6c46074555e92f07de4527b64dbb4eafdf
        run: |
          mkdir packages
          cd packages
          for name in XR1-L-Player-Beta-V2-Linux-x86_64.zip XR1-L-Player-Beta-V2-SHA256SUMS XR1-L-Player.png XR1-L-Player.ico expected-before.json; do
            curl --fail --location --retry 3 --max-time 120 "$ASSET_BASE/$name" --output "$name"
          done
      - name: Update only Linux ZIP, icons and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.parse, urllib.request
          repository = os.environ['GH_REPO']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          api = 'https://api.github.com/repos/' + repository
          release_url = api + '/releases/442314510'
          def request(url, method='GET', data=None, content_type=None):
              outgoing = dict(headers)
              if content_type:
                  outgoing['Content-Type'] = content_type
              with urllib.request.urlopen(urllib.request.Request(url, data=data, headers=outgoing, method=method), timeout=180) as response:
                  body = response.read()
                  return json.loads(body) if body else None
          def patch_asset(asset_id, name):
              return request(api + '/releases/assets/' + str(asset_id), 'PATCH', json.dumps({'name': name}).encode(), 'application/json')
          def get_release():
              release = request(release_url)
              assert release['tag_name'] == 'beta-v2' and not release['draft'] and release['prerelease']
              return release
          folder = pathlib.Path('packages')
          before = json.loads((folder / 'expected-before.json').read_text())
          release = get_release()
          def verify_unchanged(release):
              assets = {a['name']: a for a in release['assets']}
              for name in ['XR1-L-Player-Beta-V2-Linux-x86_64.AppImage', 'XR1-L-Player-Beta-V2-Windows-x64.zip']:
                  assert assets[name]['digest'] == before[name]['digest'] and assets[name]['size'] == before[name]['size']
          verify_unchanged(release)
          names = ['XR1-L-Player-Beta-V2-Linux-x86_64.zip', 'XR1-L-Player.png', 'XR1-L-Player.ico', 'XR1-L-Player-Beta-V2-SHA256SUMS']
          for name in names:
              data = (folder / name).read_bytes()
              expected = 'sha256:' + hashlib.sha256(data).hexdigest()
              assets = {a['name']: a for a in get_release()['assets']}
              current = assets.get(name)
              if current and current['digest'] == expected:
                  continue
              if current:
                  assert name in before and current['digest'] == before[name]['digest'], 'Unexpected asset revision'
              staged_name = name + '.icon-update'
              staged = assets.get(staged_name)
              if staged:
                  assert staged['digest'] == expected
              else:
                  url = 'https://uploads.github.com/repos/' + repository + '/releases/442314510/assets?name=' + urllib.parse.quote(staged_name)
                  mime = 'image/png' if name.endswith('.png') else 'image/x-icon' if name.endswith('.ico') else 'application/octet-stream'
                  staged = request(url, 'POST', data, mime)
              assert staged['size'] == len(data) and staged['digest'] == expected
              if current:
                  backup_name = name + '.before-icon-update'
                  backup = assets.get(backup_name)
                  if backup:
                      assert backup['digest'] == current['digest']
                      request(api + '/releases/assets/' + str(current['id']), 'DELETE')
                  else:
                      patch_asset(current['id'], backup_name)
              result = patch_asset(staged['id'], name)
              assert result['digest'] == expected
              print('Updated:', name)
          release = get_release()
          verify_unchanged(release)
          assets = {a['name']: a for a in release['assets']}
          for name in names:
              expected = hashlib.sha256((folder / name).read_bytes()).hexdigest()
              assert assets[name]['digest'] == 'sha256:' + expected
              url = assets[name]['browser_download_url'] + '?icon-update=' + expected[:12]
              digest = hashlib.sha256()
              with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'XR1-L-Player-icon-verification'}), timeout=180) as response:
                  while chunk := response.read(1024 * 1024):
                      digest.update(chunk)
              assert digest.hexdigest() == expected
              print('Verified public download:', name)
          for name in names:
              backup = assets.get(name + '.before-icon-update')
              if backup:
                  assert name in before and backup['digest'] == before[name]['digest']
                  request(api + '/releases/assets/' + str(backup['id']), 'DELETE')
          release = get_release()
          addition = 'Linux ZIP also includes the Windows executable icon as PNG and ICO for custom launchers. The AppImage and Windows package are unchanged.'
          if addition not in (release.get('body') or ''):
              request(release_url, 'PATCH', json.dumps({'body': (release.get('body') or '').rstrip() + '\n\n' + addition + '\n'}).encode(), 'application/json')
          verify_unchanged(get_release())
          print('PASS logo bundle published; AppImage, Windows package and release status unchanged')
          PY
